services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdr}
      POSTGRES_DB: ${POSTGRES_DB:-sdr}
    # Host-side port defaults to 5433, not 5432: a locally-installed Postgres
    # (Postgres.app, brew, etc.) commonly already owns 5432, and that
    # conflict has nothing to do with this project. Internal app<->db
    # traffic is unaffected either way - it always uses the container's
    # actual port 5432 over the docker network.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Not published to a fixed host port by default: Ollama is commonly
    # already installed and running natively on 11434 (same reason as the
    # Postgres port above). OLLAMA_HOST_PORT overrides if you want host
    # access to this containerized instance specifically.
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Always correct for container-to-container traffic, regardless of
      # whatever POSTGRES_HOST/POSTGRES_PORT/OLLAMA_HOST ends up in .env for
      # local use.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./:/app
    # Placeholder until Phase 8 adds the FastAPI service; keeps the
    # container up so `docker compose exec app pytest` works meanwhile.
    command: ["sleep", "infinity"]

volumes:
  pgdata:
  ollama_models:
