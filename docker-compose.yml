services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdr}
      POSTGRES_DB: ${POSTGRES_DB:-sdr}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./:/app
    # Placeholder until Phase 8 adds the FastAPI service; keeps the
    # container up so `docker compose exec app pytest` works meanwhile.
    command: ["sleep", "infinity"]

volumes:
  pgdata:
